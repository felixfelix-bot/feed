# Nostr CI (ngit-ci) workflow for the TollGate OpenWrt feed.
#
# ngit-ci executes ONLY files under .ngit/act/workflows/ (the GitHub copy at
# .github/workflows/validate-feed.yml is detected but never executed by it), so
# this file is what gives the repo CI on Nostr while GitHub keeps running the
# original.
#
# Every check below runs in seconds, needs no OpenWrt SDK, and was executed by
# hand in a clean checkout of this branch before being committed (see
# .ngit/README.md for what is deliberately NOT covered).
name: Feed Test

on:
  push:
  pull_request:

jobs:
  feed-check:
    name: Shell, Makefile and package-file checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PKG_DIR: net/tollgate-wrt
      UPSTREAM: OpenTollGate/tollgate-module-basic-go
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The act job containers used by ngit-ci are lighter than GitHub runner
      # VMs and do not guarantee shellcheck, so install it explicitly.
      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck --version

      - name: Collect the shell scripts under test
        run: |
          set -euo pipefail
          # Scripts are only those with a real sh/ash/bash shebang: the vendored
          # runtime files under $PKG_DIR/files (init.d, uci-defaults, hotplug,
          # usr/bin helpers, first-login-setup) plus the repo's own scripts/.
          # The captive-portal site under files/ is generated JS/CSS/HTML, not
          # shell, and has no shebang, so it is skipped by construction.
          mapfile -t FILES < <(
            grep -rlE '^#! ?/bin/(sh|ash)|^#! ?/usr/bin/env (ba)?sh' \
              scripts "$PKG_DIR/files" 2>/dev/null | sort
          )
          [ "${#FILES[@]}" -gt 0 ] || { echo "FAIL: no shell scripts found"; exit 1; }
          printf '%s\n' "${FILES[@]}" | tee /tmp/shell-files.txt
          echo "Found ${#FILES[@]} shell script(s)."

      - name: POSIX syntax check (sh -n)
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            sh -n "$f"
            echo "OK   $f"
          done < /tmp/shell-files.txt
          echo "All scripts parse under sh."

      - name: shellcheck (errors only)
        run: |
          set -euo pipefail
          mapfile -t FILES < /tmp/shell-files.txt
          # --severity=error, not the shellcheck default: OpenWrt's /bin/sh is
          # busybox ash, which DOES support `local` (SC3043) and whose
          # /etc/rc.common framework consumes START/USE_PROCD/EXTRA_COMMANDS
          # declared at file scope (SC2034). Those warnings are expected in
          # OpenWrt init scripts and are not gateable; genuine errors still fail.
          shellcheck --severity=error "${FILES[@]}"
          echo "shellcheck: no errors."

      - name: Lint the package Makefile
        run: |
          set -euo pipefail
          M="$PKG_DIR/Makefile"
          [ -f "$M" ] || { echo "FAIL: $M not found"; exit 1; }

          for field in PKG_NAME PKG_VERSION PKG_RELEASE PKG_SOURCE_URL PKG_HASH \
                       PKG_MAINTAINER PKG_LICENSE PKG_BUILD_DIR GO_PKG GO_PKG_BUILD_PKG; do
            grep -qE "^${field}:=" "$M" || { echo "FAIL: missing ${field}:="; exit 1; }
          done
          grep -q 'BuildPackage' "$M" || { echo "FAIL: missing BuildPackage eval"; exit 1; }
          grep -qE '^include \$\(TOPDIR\)/feeds/packages/lang/golang/golang-package\.mk' "$M" \
            || { echo "FAIL: golang-package.mk is not included from the packages feed (src-git feed wiring)"; exit 1; }

          # openwrt/packages policy for a package submitted upstream.
          if grep -q 'REPLACES' "$M"; then echo "FAIL: REPLACES is not allowed upstream"; exit 1; fi
          grep -qE '^PKG_LICENSE:=GPL-3\.0-only' "$M" || { echo "FAIL: PKG_LICENSE must be GPL-3.0-only"; exit 1; }

          HASH="$(grep -E '^PKG_HASH:=' "$M" | sed 's/^PKG_HASH:=//')"
          [ "$HASH" != "skip" ] || { echo "FAIL: PKG_HASH is 'skip'"; exit 1; }
          printf '%s' "$HASH" | grep -qE '^[0-9a-f]{64}$' || { echo "FAIL: PKG_HASH is not a 64-char sha256"; exit 1; }

          echo "Makefile lint passed."

      - name: Verify every ./files/ path referenced by the Makefile exists
        run: |
          set -euo pipefail
          # The Makefile installs from the vendored tree in this repo, so a
          # rename in files/ without a matching Makefile edit must fail here
          # rather than at package-install time on a router.
          while IFS= read -r ref; do
            [ -e "$PKG_DIR/$ref" ] || { echo "FAIL: Makefile references $ref but $PKG_DIR/$ref is missing"; exit 1; }
            echo "OK   ./$ref"
          done < <(
            grep -oE '\./files/[^[:space:]]+' "$PKG_DIR/Makefile" \
              | sed -e 's/\*$//' -e 's#/\.$##' | sort -u
          )
          echo "All referenced files/ paths exist."

      - name: Verify PKG_HASH against the pinned upstream tarball
        run: |
          set -euo pipefail
          M="$PKG_DIR/Makefile"
          EXPECTED="$(grep -E '^PKG_HASH:=' "$M" | sed 's/^PKG_HASH:=//')"
          PKG_VERSION="$(grep -E '^PKG_VERSION:=' "$M" | sed 's/^PKG_VERSION:=//')"
          URL="https://codeload.github.com/${UPSTREAM}/tar.gz/v${PKG_VERSION}"
          echo "Fetching $URL"
          ACTUAL="$(curl -fsSL "$URL" | sha256sum | awk '{print $1}')"
          echo "expected=$EXPECTED"
          echo "actual  =$ACTUAL"
          [ "$EXPECTED" = "$ACTUAL" ] || { echo "FAIL: PKG_HASH does not match the pinned release tarball"; exit 1; }
          echo "PKG_HASH matches the pinned release."

  # NOTE: no build job here by design. The OpenWrt SDK build in
  # .github/workflows/validate-feed.yml uses `container:` (refused by ngit-ci)
  # and takes 30-60 minutes per target, so it cannot run on Nostr CI and stays
  # authoritative on GitHub. See .ngit/README.md.
