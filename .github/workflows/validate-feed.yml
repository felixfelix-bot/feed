name: Validate Feed

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"   # weekly: catch breakage from openwrt master / golang-package.mk churn

env:
  PKG_DIR: net/tollgate-wrt
  UPSTREAM: OpenTollGate/tollgate-module-basic-go

jobs:
  validate:
    name: Lint Makefile, verify hash & files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Makefile fields
        run: |
          set -e
          M="$PKG_DIR/Makefile"
          [ -f "$M" ] || { echo "FAIL: $M not found"; exit 1; }
          for field in PKG_NAME PKG_VERSION PKG_RELEASE PKG_SOURCE_URL PKG_HASH \
                       PKG_LICENSE GO_PKG GO_PKG_BUILD_PKG; do
            grep -q "^${field}:" "$M" || { echo "FAIL: missing $field"; exit 1; }
          done
          grep -q 'BuildPackage' "$M" || { echo "FAIL: missing BuildPackage eval"; exit 1; }

          # Upstream policy: REPLACES is not allowed in openwrt/packages.
          grep -q 'REPLACES' "$M" && { echo "FAIL: REPLACES not allowed upstream"; exit 1; }

          echo "Makefile lint passed."

      - name: Verify PKG_HASH against the source tarball
        run: |
          set -e
          M="$PKG_DIR/Makefile"
          EXPECTED=$(grep '^PKG_HASH:' "$M" | sed 's/^PKG_HASH:=//')
          PKG_VERSION=$(grep '^PKG_VERSION:' "$M" | sed 's/^PKG_VERSION:=//')
          [ "$EXPECTED" != "skip" ] || { echo "FAIL: PKG_HASH is 'skip'"; exit 1; }

          URL="https://codeload.github.com/${UPSTREAM}/tar.gz/v${PKG_VERSION}"
          echo "Fetching $URL"
          ACTUAL=$(curl -fsSL "$URL" | sha256sum | awk '{print $1}')
          echo "expected=$EXPECTED"
          echo "actual  =$ACTUAL"
          [ "$EXPECTED" = "$ACTUAL" ] || { echo "FAIL: PKG_HASH mismatch"; exit 1; }

      - name: Verify every ./files/ path referenced by the Makefile exists
        run: |
          set -e
          M="$PKG_DIR/Makefile"
          # Pull out ./files/... tokens, strip a trailing glob '*' or cp '/.' suffix.
          grep -oP '\./files/\S+' "$M" \
            | sed -e 's/\*$//' -e 's#/\.$##' \
            | sort -u \
            | while IFS= read -r ref; do
                [ -e "$PKG_DIR/$ref" ] || { echo "FAIL: Makefile references $ref but $PKG_DIR/$ref is missing"; exit 1; }
              done
          echo "All referenced files/ paths exist."

      - name: Verify the critical runtime files are vendored
        run: |
          set -e
          for f in \
            files/etc/init.d/tollgate-wrt \
            files/etc/config/firewall-tollgate \
            files/etc/uci-defaults/99-tollgate-setup \
            files/etc/uci-defaults/90-tollgate-captive-portal-symlink \
            files/etc/hotplug.d/iface/95-tollgate-restart \
            files/lib/upgrade/keep.d/tollgate; do
            [ -f "$PKG_DIR/$f" ] || { echo "FAIL: missing $f"; exit 1; }
          done
          echo "Critical files present."

  go-smoke:
    name: Go cross-compile (no SDK)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: amd64,                      goarm: "",  gomips: "" }
          - { goarch: arm64,                      goarm: "",  gomips: "" }
          - { goarch: mipsle,                     goarm: "",  gomips: softfloat }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Download pinned upstream source
        run: |
          set -e
          PKG_VERSION=$(grep '^PKG_VERSION:' "$PKG_DIR/Makefile" | sed 's/^PKG_VERSION:=//')
          URL="https://codeload.github.com/${UPSTREAM}/tar.gz/v${PKG_VERSION}"
          curl -fsSL "$URL" | tar -xz
          echo "TOLLGATE_SRC=$PWD/tollgate-module-basic-go-$PKG_VERSION/src" >> "$GITHUB_ENV"

      - name: Build service + CLI for ${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
        run: |
          set -e
          # Service: main module root at src/.
          (cd "$TOLLGATE_SRC" && go build -o /dev/null .)
          # CLI: separate module at src/cmd/tollgate-cli/.
          (cd "$TOLLGATE_SRC/cmd/tollgate-cli" && go build -o /dev/null .)

  build-sdk:
    name: SDK build (${{ matrix.target }})
    runs-on: ubuntu-latest
    # The authoritative proof that the package compiles inside the OpenWrt
    # build system via golang-package.mk (incl. the nested CLI module build).
    # Slow (~30-60 min/job: it bootstraps the Go toolchain). Runs on main
    # pushes, PRs, tags, weekly, and manual dispatch. The 3-target matrix
    # proves the real TollGate hardware arches alongside x86-64.
    if: >-
      github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
      || github.event_name == 'schedule'
      || startsWith(github.ref, 'refs/tags/')
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        # Pinned 2026-10-12 to the newest openwrt/sdk RELEASE tags (verified
        # live on Docker Hub: v25.12.5 is the newest release for all three
        # targets; no v25.12.6+ exists yet). Each entry carries the manifest
        # digest so the pin is immutable — a bare moving/major tag (and
        # absolutely not the old :*-master images, which were rebuilt
        # 2026-08-14 with glibc >= 2.42 / iconv removal and broke
        # gettext-full) can silently change under us. Snapshot tarballs also
        # hit mirror sha256 skew; release images are pre-extracted and frozen
        # at the 25.12.x toolchain (glibc < 2.42), fixing both failure modes.
        #
        # All three release images are built from OpenWrt branch 25.12 —
        # verified from the image itself: /builder/feeds.conf.default pins
        # openwrt.git^f0a60eee2fe051741c643ea6118718aae1ef17fb, whose message
        # is literally "OpenWrt v25.12.5" and which is an ancestor of
        # openwrt-25.12 (compare ahead_by=252 behind_by=0). That branch ships
        # GO_DEFAULT_VERSION:=1.26, so the golang package matrix variable
        # below is 1.26 for every target. This is matrix-driven rather than
        # hardcoded so a future target pinned to a different branch (e.g.
        # 24.10, which ships an unversioned `golang`) declares its own value
        # instead of silently inheriting 25.12's.
        #
        # Digests cross-checked two ways (docker manifest inspect --verbose
        # and the registry docker-content-digest header) and both agree.
        include:
          - target: x86-64
            desc: "host-runnable (amd64)"
            golang: golang1.26
            digest: sha256:e916b7cc555890bdc4725c926e139b888294f0c8f56561b88d8da3a6348616a2
          - target: mediatek-filogic
            desc: "GL-MT6000 (aarch64)"
            golang: golang1.26
            digest: sha256:011c367ac3e63ab3fd345bdb242564fedda033b40e73f883bd550fcf0d27bf9c
          - target: ramips-mt7621
            desc: "GL-MT3000 (mipsle)"
            golang: golang1.26
            digest: sha256:45a090c9883f42b649be77a1610a5bae4aae6c914e7ea4a5396be47707b74701
    container:
      # <tag>@sha256:<digest>: the digest, not the tag, is what Docker
      # resolves, so this reference cannot move. Keep the human-readable
      # target+version in the tag for debuggability.
      image: openwrt/sdk:${{ matrix.target }}-v25.12.5@${{ matrix.digest }}
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Extract the OpenWrt SDK
        # PINNED release images (openwrt/sdk:*-v25.12.5, resolved by digest)
        # are pre-extracted (./scripts present) so setup.sh is skipped. We pin
        # release tags — NOT the moving :*-master images (rebuilt ~2026-08-14
        # with glibc >=2.42 / iconv removal, breaking gettext-full; and
        # snapshot SDK tarballs hit mirror sha256 skew). Release images are
        # frozen at the 25.12.x toolchain (glibc < 2.42) and pre-extracted,
        # fixing both. See openwrt/docker README.
        shell: bash
        run: cd /builder && { [ -d ./scripts ] || ./setup.sh; }

      - name: Restore SDK build cache
        # Cache the built Go toolchain (golang/host) + build state so re-runs
        # skip the ~40 min Go bootstrap. run_id makes the key unique (always
        # re-saves); restore-keys prefix finds the previous run's cache for
        # this target. Note: 10 GB/repo cap — 3 arches may occasionally evict
        # (self-healing: one cold run, then re-cached).
        uses: actions/cache@v4
        with:
          path: |
            /builder/staging_dir
            /builder/build_dir
            /builder/dl
          key: sdkbuild-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            sdkbuild-${{ matrix.target }}-

      - name: Add this feed alongside the standard feeds
        shell: bash
        run: |
          set -e
          cd /builder
          cp feeds.conf.default feeds.conf
          # src-link so the SDK builds straight from this checkout.
          echo "src-link tollgate $GITHUB_WORKSPACE" >> feeds.conf
          ./scripts/feeds update -a
          # Targeted install (not -a): -a pulls every feed package and exposes
          # current openwrt-master recursive-dependency breakage (luci,
          # strongswan, ...). The versioned golang package (${{ matrix.golang }})
          # must match the SDK image's OpenWrt branch: `golang` is a dummy whose
          # HOST_BUILD_DEPENDS is golang<X>/host (the real toolchain). Pinned
          # per-target in the matrix above because the version differs by branch
          # (25.12 -> golang1.26 via GO_DEFAULT_VERSION; 24.10 ships no
          # golang1.x package at all). Changing the SDK image pin therefore
          # requires updating matrix.golang in the same commit.
          ./scripts/feeds install tollgate-wrt golang ${{ matrix.golang }} nodogsplash jq

      - name: Configure
        shell: bash
        run: |
          cd /builder
          # The SDK ships a bloated config (CONFIG_ALL/ALL_KMODS) that makes
          # builds compile every kmod and time out. Re-seed minimal: keep only
          # the target selection + our packages, build-all flags off. (Don't use
          # scripts/config -- in this image it's a directory, not the helper.)
          make defconfig
          {
            grep -E '^CONFIG_TARGET' .config 2>/dev/null
            printf '# CONFIG_ALL is not set\n# CONFIG_ALL_KMODS is not set\n# CONFIG_ALL_NONSHARED is not set\n'
            printf 'CONFIG_PACKAGE_tollgate-wrt=y\nCONFIG_PACKAGE_nodogsplash=y\nCONFIG_PACKAGE_jq=y\n'
          } > .config.min
          mv .config.min .config
          make defconfig
          echo "enabled packages (=y): $(grep -c '=y' .config)"

      - name: Build tollgate-wrt
        shell: bash
        run: |
          cd /builder
          make -j"$(nproc)" package/tollgate-wrt/compile V=s

      - name: Collect & show produced package(s)
        shell: bash
        run: |
          set -e
          cd /builder
          echo "=== produced package(s) ==="
          find bin -type f \( -name 'tollgate-wrt*.ipk' -o -name 'tollgate-wrt*.apk' \) -print -exec ls -lh {} \;
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          find bin -type f \( -name 'tollgate-wrt*.ipk' -o -name 'tollgate-wrt*.apk' \) \
            -exec cp {} "$GITHUB_WORKSPACE/artifacts/" \;
          echo "=== staged for upload ==="
          ls -lh "$GITHUB_WORKSPACE/artifacts/"

      - name: Upload package artifact(s)
        uses: actions/upload-artifact@v4
        with:
          name: tollgate-wrt-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
