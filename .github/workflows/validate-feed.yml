name: Validate Feed

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"   # weekly: catch breakage from openwrt master / golang-package.mk churn

env:
  PKG_DIR: net/tollgate-wrt
  UPSTREAM: OpenTollGate/tollgate-module-basic-go
  SDK_PIN: v25.12.5

jobs:
  validate:
    name: Version identity, hash & vendored files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Offline gate (version strings, metadata, install paths)
        run: sh scripts/check-version-strings.sh

      - name: Upstream policy
        run: |
          set -e
          M="$PKG_DIR/Makefile"
          # openwrt/packages does not accept REPLACES in new packages.
          if grep -q 'REPLACES' "$M"; then
            echo "FAIL: REPLACES not allowed upstream"; exit 1
          fi
          grep -q 'BuildPackage' "$M" || { echo "FAIL: missing BuildPackage eval"; exit 1; }
          echo "policy checks passed"

      - name: Verify PKG_HASH and files/ against the pinned release tarball
        run: sh scripts/check-version-strings.sh --hash

  go-smoke:
    name: Go cross-compile (no SDK)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: amd64,  goarm: "",  gomips: "" }
          - { goarch: arm64,  goarm: "",  gomips: "" }
          - { goarch: mipsle, goarm: "",  gomips: softfloat }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # The pinned module declares `go 1.25.0`; anything older refuses to
          # build it. Keep this >= the go directive in src/go.mod.
          go-version: "1.25"

      - name: Download pinned upstream source
        run: |
          set -e
          # PKG_SOURCE_VERSION is the tag body. PKG_VERSION is the package
          # manager's spelling (0.6.0_alpha1 / 0.6.0~alpha1) and is NOT the tag.
          SRCVER=$(sed -n 's/^PKG_SOURCE_VERSION:=//p' "$PKG_DIR/Makefile" | head -1)
          URL="https://codeload.github.com/${UPSTREAM}/tar.gz/v${SRCVER}"
          echo "Fetching $URL"
          curl -fsSL "$URL" | tar -xz
          echo "TOLLGATE_SRC=$PWD/tollgate-module-basic-go-${SRCVER}/src" >> "$GITHUB_ENV"

      - name: Build service + CLI for ${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
        run: |
          set -e
          # Service: main module root at src/.
          (cd "$TOLLGATE_SRC" && go build -o /dev/null .)
          # CLI: separate module at src/cmd/tollgate-cli/.
          (cd "$TOLLGATE_SRC/cmd/tollgate-cli" && go build -o /dev/null .)

  build-sdk:
    name: SDK build (${{ matrix.target }})
    runs-on: ubuntu-latest
    # The authoritative proof that the package compiles inside the OpenWrt
    # build system via golang-package.mk (incl. the nested CLI module build).
    # Slow (~30-60 min/job: it bootstraps the Go toolchain). Runs on main
    # pushes, PRs, tags, weekly, and manual dispatch. The 3-target matrix
    # proves the real TollGate hardware arches alongside x86-64.
    if: >-
      github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch'
      || github.event_name == 'schedule'
      || startsWith(github.ref, 'refs/tags/')
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86-64,          desc: "host-runnable (amd64)" }
          - { target: mediatek-filogic, desc: "GL-MT6000 (aarch64)" }
          - { target: ramips-mt7621,    desc: "GL-MT3000 (mipsle)" }
    container:
      image: openwrt/sdk:${{ matrix.target }}-v25.12.5
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Extract the OpenWrt SDK
        # PINNED release images (openwrt/sdk:*-v25.12.5) are pre-extracted
        # (./scripts present) so setup.sh is skipped. We pin release tags —
        # NOT the moving :*-master images (rebuilt ~2026-08-14 with glibc
        # >=2.42 / iconv removal, breaking gettext-full; and snapshot SDK
        # tarballs hit mirror sha256 skew). Release images are frozen at the
        # 25.12.x toolchain (glibc < 2.42) and pre-extracted, fixing both.
        # See openwrt/docker README.
        shell: bash
        run: cd /builder && { [ -d ./scripts ] || ./setup.sh; }

      - name: Restore SDK build cache
        # Cache the built Go toolchain (golang/host) + build state so re-runs
        # skip the ~40 min Go bootstrap. run_id makes the key unique (always
        # re-saves); restore-keys prefix finds the previous run's cache for
        # this target. Note: 10 GB/repo cap — 3 arches may occasionally evict
        # (self-healing: one cold run, then re-cached).
        #
        # The key is NAMESPACED with the SDK image version (v25.12.5). This is
        # mandatory: a cache built against one toolchain (e.g. the moving
        # openwrt/sdk:*-master images, glibc >=2.42) poisons a build against a
        # different one (pinned v25.12.5, glibc <2.42). Root-caused 2026-09-08:
        # ramips-mt7621 restored a stale Aug-24 -master cache into the pinned
        # image → gettext-full [host] failed (~16 min in) with
        # "ctype.h: operator '||' has no left operand" / "#if with no expression"
        # while x86-64/mediatek (which had saved fresh post-pin caches) passed.
        # Bump this namespace tag whenever the SDK image version changes.
        uses: actions/cache@v4
        with:
          path: |
            /builder/staging_dir
            /builder/build_dir
            /builder/dl
          key: sdkbuild-${{ matrix.target }}-v25.12.5-${{ github.run_id }}
          restore-keys: |
            sdkbuild-${{ matrix.target }}-v25.12.5-

      - name: Add this feed alongside the standard feeds
        shell: bash
        run: |
          set -e
          cd /builder
          cp feeds.conf.default feeds.conf
          # src-link so the SDK builds straight from this checkout.
          echo "src-link tollgate $GITHUB_WORKSPACE" >> feeds.conf
          ./scripts/feeds update packages tollgate
          # Targeted install (not -a): -a pulls every feed package and exposes
          # current openwrt-master recursive-dependency breakage (luci,
          # strongswan, ...). golang1.26 is required because the `golang`
          # package is a dummy whose HOST_BUILD_DEPENDS is golang1.26/host
          # (the real toolchain). Bump 1.26 if GO_DEFAULT_VERSION changes.
          #
          # nodogsplash is deliberately NOT installed: it does not exist in the
          # 25.12 packages feed (only openwrt/packages@master carries
          # net/nodogsplash), so asking feeds for it fails the job. The
          # dependency is a runtime one and does not affect compilation.
          ./scripts/feeds install -a -p tollgate
          ./scripts/feeds install golang golang1.26 jq

      - name: Configure
        shell: bash
        run: |
          set -e
          cd /builder
          # The SDK ships a bloated config (CONFIG_ALL/ALL_KMODS) that makes
          # builds compile every kmod and time out. Re-seed minimal: keep only
          # the target selection + our packages, build-all flags off. (Don't use
          # scripts/config -- in this image it's a directory, not the helper.)
          make defconfig
          {
            grep -E '^CONFIG_TARGET' .config 2>/dev/null
            printf '# CONFIG_ALL is not set\n# CONFIG_ALL_KMODS is not set\n# CONFIG_ALL_NONSHARED is not set\n'
            printf 'CONFIG_PACKAGE_tollgate-wrt=y\nCONFIG_PACKAGE_jq=y\n'
          } > .config.min
          mv .config.min .config
          make defconfig
          echo "enabled packages (=y): $(grep -c '=y' .config)"

      - name: Download (verifies PKG_HASH)
        shell: bash
        run: |
          cd /builder
          make -j"$(nproc)" package/feeds/tollgate/tollgate-wrt/download V=s

      - name: Check
        shell: bash
        run: |
          cd /builder
          make -j"$(nproc)" package/feeds/tollgate/tollgate-wrt/check V=s

      - name: Build tollgate-wrt
        shell: bash
        run: |
          cd /builder
          make -j"$(nproc)" package/feeds/tollgate/tollgate-wrt/compile V=s

      - name: Collect & show produced package(s)
        shell: bash
        run: |
          set -e
          cd /builder
          echo "=== produced package(s) ==="
          find bin -type f \( -name 'tollgate-wrt*.ipk' -o -name 'tollgate-wrt*.apk' \) -print -exec ls -lh {} \;
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          find bin -type f \( -name 'tollgate-wrt*.ipk' -o -name 'tollgate-wrt*.apk' \) \
            -exec cp {} "$GITHUB_WORKSPACE/artifacts/" \;
          echo "=== staged for upload ==="
          ls -lh "$GITHUB_WORKSPACE/artifacts/"

      - name: Version check inside the built package
        # The CI harness' version check is supplied by net/tollgate-wrt/
        # test-version.sh, because neither binary implements --version (see
        # that script). Do it here as well so the SDK job proves the injected
        # version, not just that the package compiled.
        #
        # WHERE the binary is: NOT the raw build output. OpenWrt's
        # CONFIG_AUTOREMOVE hook (include/package.mk:328) purges every entry at
        # depth 1 of PKG_BUILD_DIR except empty dotfiles, .pkgdir and
        # version.date - which deletes .go_work/, the golang-package.mk dir
        # holding the raw tollgate-module-basic-go binary. What survives is the
        # packaged path <PKG_BUILD_DIR>/.pkgdir/tollgate-wrt/usr/bin/tollgate-wrt
        # (plus the rootfs copy under staging_dir/target-*/root-*/usr/bin/).
        #
        # The search is VERSION-SCOPED on purpose: /builder/build_dir and
        # /builder/staging_dir are cache-restored, so they still contain
        # tollgate-module-basic-go-<older-version>/ trees; an unversioned
        # `find -name tollgate-wrt` picks a stale binary and reports a version
        # mismatch that is not real (observed: mipsel_24kc restored a 0.5.0
        # tree and matched it before the freshly built 0.6.0-alpha1 one).
        shell: bash
        run: |
          set -e
          cd /builder
          SRCVER=$(sed -n 's/^PKG_SOURCE_VERSION:=//p' "$GITHUB_WORKSPACE/$PKG_DIR/Makefile" | head -1)
          # PKG_VERSION is the package manager's spelling of the same release
          # (0.6.0-alpha1 -> 0.6.0_alpha1 on apk); the package FILENAME uses it.
          PKGVER=$(printf '%s' "$SRCVER" | sed 's/^\([0-9.]*\)-\(.*\)$/\1_\2/')

          # (1) the artifact THIS run produced must carry the pinned version.
          # bin/ is not cache-restored, so this cannot match a stale build.
          PKG=$(find bin -type f \( -name 'tollgate-wrt*.apk' -o -name 'tollgate-wrt*.ipk' \) | head -1)
          [ -n "$PKG" ] || { echo "FAIL: no tollgate-wrt package produced under bin/"; exit 1; }
          echo "produced package: $PKG"
          case "$PKG" in
            *"$PKGVER"*|*"$SRCVER"*) ;;
            *) echo "FAIL: produced package name does not carry $PKGVER / $SRCVER"; exit 1 ;;
          esac

          # (2) the installed service binary must carry the injected version.
          BIN=""
          for pat in \
            "*/tollgate-module-basic-go-$SRCVER/src/.pkgdir/tollgate-wrt/usr/bin/tollgate-wrt" \
            "*/tollgate-module-basic-go-$SRCVER*/usr/bin/tollgate-wrt"; do
            BIN=$(find build_dir staging_dir -type f -path "$pat" 2>/dev/null | head -1)
            if [ -n "$BIN" ]; then break; fi
          done
          if [ -z "$BIN" ]; then
            echo "FAIL: no packaged tollgate-wrt binary for $SRCVER under build_dir/staging_dir"
            echo "--- tollgate build trees present (cached; older versions are expected) ---"
            find build_dir -maxdepth 3 -type d -name 'tollgate-module-basic-go-*' 2>/dev/null
            echo "--- tollgate-wrt binaries present ---"
            find build_dir staging_dir -type f -name 'tollgate-wrt' 2>/dev/null | head -20
            echo "--- produced packages ---"
            find bin -type f \( -name 'tollgate-wrt*.apk' -o -name 'tollgate-wrt*.ipk' \) -print
            exit 1
          fi
          echo "expecting v$SRCVER in $BIN"
          strings "$BIN" | grep -F -- "v$SRCVER"
          CLI="$(dirname "$BIN")/tollgate"
          if [ ! -f "$CLI" ]; then CLI="$(dirname "$BIN")/tollgate-cli"; fi
          [ -f "$CLI" ] || { echo "FAIL: CLI binary missing next to $BIN"; exit 1; }
          echo "CLI binary present: $CLI"

      - name: Upload package artifact(s)
        uses: actions/upload-artifact@v4
        with:
          name: tollgate-wrt-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  feed-index:
    # The runtime-feed half: index generation, signing and the publish step's
    # refusal rules. Both tests run against the SDK's HOST apk-tools (the target
    # rootfs apk has no mkndx) and a real OpenWrt rootfs image.
    name: Runtime feed index (publish, sign, trust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract the SDK host tools (apk-tools with mkndx, usign)
        run: bash scripts/get-host-apk-tools.sh --out .feed-tools/apk

      - name: Publish refusal rules (manifest, re-cut, retention, dry-run)
        run: bash tests/feed-publish-test.sh --apk-bin .feed-tools/apk/bin/apk

      - name: apk index trust on a real 25.12 rootfs
        # unsigned index MUST fail with UNTRUSTED signature, signed MUST work,
        # missing/wrong key MUST fail, and apk add MUST install from the signed
        # index. Runs the real apk-tools from openwrt/rootfs:x86_64-v25.12.4.
        run: bash tests/apk-index-trust-test.sh --apk-bin .feed-tools/apk/bin/apk

      - name: Publish, serve over HTTPS and fetch back (fixture package)
        # Publishes a fixture .apk into a tree, serves it over TLS with the
        # production cache headers (no-cache index, immutable packages), asserts
        # the live index lists every package and each one hashes to the build
        # manifest, then corrupts one served byte and requires a non-zero
        # refusal. No Caddy and no VPS: tests/feed-https-server.py is the host.
        run: bash tests/feed-https-publish-test.sh --apk-bin .feed-tools/apk/bin/apk
